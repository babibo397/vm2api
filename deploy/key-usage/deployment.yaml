apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm2api-usage
  namespace: vm2api
  labels:
    app.kubernetes.io/name: vm2api-usage
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: vm2api-usage
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vm2api-usage
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: regcred
      nodeSelector:
        nodetype: new-api
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - "172.20.127.131"
                      - "172.20.127.141"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      containers:
        - name: portal
          # Verified Singapore amd64 image: key-usage-587d2c58.
          image: hx-repo-xjp.tencentcloudcr.com/devops/vm2api-usage@sha256:5a8e4df3a71eb496da0bff843314f73f067d7cc57ed0171b811a948e080ad8e6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: BASE_PATH
              value: /usage
            - name: PUBLIC_ORIGIN
              value: https://vm2api.fireflyops.cn
            - name: VM2API_UPSTREAM
              value: http://vm2api.vm2api.svc.cluster.local:8787
            - name: KEY_RATE_LIMIT
              value: "20"
            - name: IP_RATE_LIMIT
              value: "60"
            - name: TRUST_PROXY_CIDRS
              # Observed 2026-11-11; refresh after nginx controller replacement.
              # Trust only ingress Pod IPs, never the VPC or all forwarded headers.
              value: 172.20.81.60/32
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
